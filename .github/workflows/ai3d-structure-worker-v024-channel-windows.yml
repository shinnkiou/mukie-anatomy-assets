name: AI3D Structure Worker v0.2.4 CANARY-005 Channel

on:
  workflow_dispatch:
  push:
    branches:
      - ai3d-013-structure-canary-20260914
    paths:
      - 'ai3d_engine/windows_worker/ai3d_structure_worker_v024.py'
      - 'ai3d_engine/windows_worker/ai3d_structure_worker_current_v024.py'
      - 'ai3d_engine/windows_worker/blender_structure_module_canary_v024.py'
      - '.github/workflows/ai3d-structure-worker-v024-channel-windows.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1

      - name: Syntax and fail-closed self-test
        shell: pwsh
        run: |
          python -m py_compile ai3d_engine/windows_worker/ai3d_worker.py
          python -m py_compile ai3d_engine/windows_worker/ai3d_structure_worker.py
          python -m py_compile ai3d_engine/windows_worker/ai3d_structure_worker_v021.py
          python -m py_compile ai3d_engine/windows_worker/ai3d_structure_worker_v024.py
          python -m py_compile ai3d_engine/windows_worker/ai3d_structure_worker_current_v024.py
          python -m py_compile ai3d_engine/windows_worker/blender_structure_module_canary_v024.py
          python ai3d_engine/windows_worker/ai3d_structure_worker_current_v024.py --self-test

      - name: Build v0.2.4 stable-channel worker
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name NEVER_TEAR_AI3D_STRUCTURE_WORKER `
            --paths ai3d_engine/windows_worker `
            --add-data "ai3d_engine/windows_worker/blender_structure_module_canary.py;." `
            --add-data "ai3d_engine/windows_worker/blender_structure_module_canary_v024.py;." `
            ai3d_engine/windows_worker/ai3d_structure_worker_current_v024.py

      - name: Verify packaged worker before channel publication
        shell: pwsh
        run: dist/NEVER_TEAR_AI3D_STRUCTURE_WORKER.exe --self-test

      - name: Build fixed-channel manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'dist/NEVER_TEAR_AI3D_STRUCTURE_WORKER.exe'
          $workerHash = (Get-FileHash $worker -Algorithm SHA256).Hash.ToLower()
          $workerSize = (Get-Item $worker).Length
          $workerVersion = (python -c "import sys; sys.path.insert(0, 'ai3d_engine/windows_worker'); import ai3d_structure_worker_current_v024 as m; print(m.WORKER_VERSION)").Trim()
          if ($workerVersion -ne '0.2.4-ai3d-structure-visualfix') { throw "unexpected worker version: $workerVersion" }
          $channel = [ordered]@{
            schema_version = 'never-tear-ai3d-structure-worker-channel-v1'
            channel = 'ai3d-structure-canary'
            capability = 'ai3d_structure_module_v1'
            release_tag = 'ai3d-structure-worker-canary-channel'
            asset_name = 'NEVER_TEAR_AI3D_STRUCTURE_WORKER.exe'
            worker_version = $workerVersion
            sha256 = $workerHash
            size_bytes = $workerSize
            min_launcher_version = '0.1.0'
            source_commit = $env:GITHUB_SHA
          }
          $channel | ConvertTo-Json | Set-Content -Encoding utf8 AI3D_STRUCTURE_WORKER_CHANNEL_V1.json
          "$workerHash  NEVER_TEAR_AI3D_STRUCTURE_WORKER.exe" | Set-Content -Encoding ascii NEVER_TEAR_AI3D_STRUCTURE_WORKER.sha256.txt

      - name: Publish fixed release channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'ai3d-structure-worker-canary-channel'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'expected stable release channel is missing' }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber `
            dist/NEVER_TEAR_AI3D_STRUCTURE_WORKER.exe `
            AI3D_STRUCTURE_WORKER_CHANNEL_V1.json `
            NEVER_TEAR_AI3D_STRUCTURE_WORKER.sha256.txt
          if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }

      - name: Upload CI evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEVER_TEAR_AI3D_STRUCTURE_WORKER_V024_CANARY005
          path: |
            AI3D_STRUCTURE_WORKER_CHANNEL_V1.json
            NEVER_TEAR_AI3D_STRUCTURE_WORKER.sha256.txt
          if-no-files-found: error
          retention-days: 30
