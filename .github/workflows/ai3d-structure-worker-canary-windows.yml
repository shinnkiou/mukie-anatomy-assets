name: AI3D Structure Worker CANARY Windows

on:
  workflow_dispatch:
  push:
    branches:
      - ai3d-013-structure-canary-20260914
    paths:
      - 'ai3d_engine/windows_worker/ai3d_structure_worker.py'
      - 'ai3d_engine/windows_worker/blender_structure_module_canary.py'
      - 'ai3d_engine/windows_worker/ai3d_worker.py'
      - 'ai3d_engine/data/ai3d_structure_capability_canary_v1.json'
      - '.github/workflows/ai3d-structure-worker-canary-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1

      - name: Static syntax and worker self-test
        shell: pwsh
        run: |
          python -m py_compile ai3d_engine/windows_worker/ai3d_worker.py
          python -m py_compile ai3d_engine/windows_worker/ai3d_structure_worker.py
          python -m py_compile ai3d_engine/windows_worker/blender_structure_module_canary.py
          python ai3d_engine/windows_worker/ai3d_structure_worker.py --self-test

      - name: Build isolated Structure companion
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY `
            --paths ai3d_engine/windows_worker `
            --add-data "ai3d_engine/windows_worker/blender_structure_module_canary.py;." `
            ai3d_engine/windows_worker/ai3d_structure_worker.py

      - name: Package verified artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe package/
          $hash = (Get-FileHash package/NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe" | Set-Content -Encoding ascii package/NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.sha256.txt
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          for /f "tokens=1" %%H in (NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.sha256.txt) do set EXPECTED=%%H
          for /f "tokens=*" %%H in ('certutil -hashfile NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe SHA256 ^| findstr /R /V "hash CertUtil"') do set ACTUAL=%%H
          set ACTUAL=%ACTUAL: =%
          if /I "%EXPECTED%"=="%ACTUAL%" (
            echo SHA256 PASS %ACTUAL%
            exit /b 0
          )
          echo SHA256 FAIL expected=%EXPECTED% actual=%ACTUAL%
          exit /b 23
          '@ | Set-Content -Encoding ascii package/VERIFY_SHA256.bat
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          call VERIFY_SHA256.bat || exit /b %errorlevel%
          set TARGET=%LOCALAPPDATA%\UKIE_AI_BRIDGE\ai3d\structure_canary
          if not exist "%TARGET%" mkdir "%TARGET%"
          copy /Y NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe "%TARGET%\NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe" >nul
          powershell -NoProfile -Command "$s=(New-Object -ComObject WScript.Shell).CreateShortcut([Environment]::GetFolderPath('StartMenu')+'\Programs\NEVER TEAR AI3D Structure Worker CANARY.lnk');$s.TargetPath='%TARGET%\NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe';$s.WorkingDirectory='%TARGET%';$s.Save()"
          echo Installed: %TARGET%\NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe
          echo Start Menu: NEVER TEAR AI3D Structure Worker CANARY
          '@ | Set-Content -Encoding ascii package/INSTALL_OR_UPDATE_NEVER_TEAR_AI3D_STRUCTURE_WORKER.bat
          @'
          NEVER TEAR AI3D-013 Structure Capability CANARY

          This is a separate fail-closed companion for exactly one bounded synthetic Structure CANARY.
          It advertises only: ai3d_structure_module_v1
          It cannot claim the Central Corridor production module and does not promote itself.

          Install:
          1. Close any older AI3D Structure Worker CANARY window.
          2. Run VERIFY_SHA256.bat.
          3. Run INSTALL_OR_UPDATE_NEVER_TEAR_AI3D_STRUCTURE_WORKER.bat.
          4. Start "NEVER TEAR AI3D Structure Worker CANARY" from Start Menu.
          5. Leave the console open. The server may arm exactly one AI3D-013 CANARY after a valid heartbeat.

          Expected banner:
          NEVER TEAR AI3D Worker 0.2.0-ai3d-structure-canary online

          Passing automated QA still leaves visual_qa=PENDING and canary_promoted=false.
          '@ | Set-Content -Encoding utf8 package/README.txt
          Compress-Archive -Path package/* -DestinationPath NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY_V020_ARTIFACT.zip -Force
          (Get-FileHash NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY_V020_ARTIFACT.zip -Algorithm SHA256).Hash.ToLower() | Set-Content -Encoding ascii NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY_V020_ARTIFACT.zip.sha256.txt

      - name: Verify packaged executable self-test
        shell: pwsh
        run: package/NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY.exe --self-test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY_V020_ARTIFACT
          path: |
            NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY_V020_ARTIFACT.zip
            NEVER_TEAR_AI3D_STRUCTURE_WORKER_CANARY_V020_ARTIFACT.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
