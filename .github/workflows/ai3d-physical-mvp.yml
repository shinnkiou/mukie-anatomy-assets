name: NEVER TEAR AI3D Physical MVP

on:
  workflow_dispatch:
  push:
    paths:
      - "ai3d_engine/cloud_runner/**"
      - ".github/workflows/ai3d-physical-mvp.yml"

permissions:
  contents: read

concurrency:
  group: ai3d-physical-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BLENDER_VERSION: "4.2.23"
      BLENDER_ARCHIVE: "blender-4.2.23-linux-x64.tar.xz"
      BLENDER_DIR: "blender-4.2.23-linux-x64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai3d_engine/artifacts/physical_mvp
          printf 'run_id=%s\nsha=%s\nref=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${GITHUB_REF}" \
            > ai3d_engine/artifacts/physical_mvp/runner.txt
          uname -a >> ai3d_engine/artifacts/physical_mvp/runner.txt

      - name: Download and verify Blender 4.2.23
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://download.blender.org/release/Blender4.2"
          curl --fail --location --retry 3 --retry-delay 3 --output "${BLENDER_ARCHIVE}" "${BASE}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 3 --output "blender-${BLENDER_VERSION}.sha256" "${BASE}/blender-${BLENDER_VERSION}.sha256"
          sha256sum --check "blender-${BLENDER_VERSION}.sha256" --ignore-missing \
            | tee ai3d_engine/artifacts/physical_mvp/download-verification.txt
          tar -xf "${BLENDER_ARCHIVE}"
          test -x "${BLENDER_DIR}/blender"
          "${BLENDER_DIR}/blender" --version \
            | tee ai3d_engine/artifacts/physical_mvp/blender-version.txt

      - name: Run synthetic physical AI3D MVP
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIR}/blender" \
            --factory-startup \
            --background \
            --python ai3d_engine/cloud_runner/blender_physical_mvp.py \
            -- \
            --output ai3d_engine/artifacts/physical_mvp \
            2>&1 | tee ai3d_engine/artifacts/physical_mvp/blender-physical-mvp.log

      - name: Validate physical evidence and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("ai3d_engine/artifacts/physical_mvp")
          result_path = root / "ai3d_physical_mvp_result.json"
          png_path = root / "ai3d_physical_mvp.png"
          manifest_path = root / "manifest.json"
          data = json.loads(result_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert data["schema_version"] == "never-tear-ai3d-blender-physical-mvp-v1", data
          assert data["project_key"] == "never_tear_ai3d_engine", data
          assert data["task_id"] == "AI3D-001", data
          assert data["status"] == "PASS", data
          assert data["route"] == "BLENDER_GITHUB_ACTIONS", data
          assert data["artifact"]["physical_render"] is True, data
          assert data["artifact"]["width"] == 960 and data["artifact"]["height"] == 540, data
          assert data["artifact"]["visual_qa"] == "PENDING", data
          assert data["synthetic_only"] is True and data["user_assets_loaded"] is False, data
          assert data["csmc_private_data_loaded"] is False, data
          assert data["canary_promoted"] is False, data
          assert all(data["checks"].values()), data
          assert png_path.exists() and png_path.stat().st_size > 0

          png_sha = hashlib.sha256(png_path.read_bytes()).hexdigest()
          result_sha = hashlib.sha256(result_path.read_bytes()).hexdigest()
          assert png_sha == data["artifact"]["png_sha256"], (png_sha, data["artifact"]["png_sha256"])
          assert manifest["files"][png_path.name]["sha256"] == png_sha, manifest
          assert manifest["files"][png_path.name]["size_bytes"] == png_path.stat().st_size, manifest
          assert manifest["files"][result_path.name]["sha256"] == result_sha, manifest

          print(json.dumps({
              "status": "PASS",
              "artifact_id": data["artifact"]["artifact_id"],
              "png_sha256": png_sha,
              "raw_pixel_sha256": data["artifact"]["raw_pixel_sha256"],
              "checkpoint_id": data["checkpoint"]["checkpoint_id"],
              "checkpoint_sha256": data["checkpoint"]["sha256"],
              "visual_qa": data["artifact"]["visual_qa"],
          }, indent=2, sort_keys=True))
          PY

      - name: Write provider-side SHA readback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd ai3d_engine/artifacts/physical_mvp
          sha256sum * > provider-sha256.txt
          cat provider-sha256.txt

      - name: Upload physical evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai3d-physical-mvp-${{ github.run_id }}
          path: ai3d_engine/artifacts/physical_mvp/
          if-no-files-found: error
          retention-days: 14
