name: CSMC consumer-constrained Importer Lab smoke

on:
  push:
    branches:
      - csmc-importer-experimental-20260902
    paths:
      - 'tools/csmc_importer/importer_lab/CSMC_CONSUMER_CONSTRAINT_PACK_V1.json'
      - 'tools/csmc_importer/importer_lab/CSMC_IMPORTER_LAB_CONSUMER_INTAKE_V1.md'
      - 'tools/csmc_importer/importer_lab/CSMC_IMPORTER_LAB_DISCRIMINATING_QUESTIONS_V1.json'
      - 'tools/csmc_importer/importer_lab/CSMC_IMPORTER_LAB_CONSUMER_COMPATIBILITY_SCHEMA_V1.json'
      - 'tools/csmc_importer/importer_lab/CSMC_DQ_SER_WIDTH_GATE_V1.json'
      - 'tools/csmc_importer/importer_lab/csmc_consumer_constrained_lab.py'
      - 'tools/csmc_importer/importer_lab/csmc_serializer_field_read_gate.py'
      - 'tools/csmc_importer/importer_lab/test_csmc_consumer_constrained_lab_synthetic.py'
      - 'tools/csmc_importer/importer_lab/test_csmc_serializer_field_read_gate.py'
      - '.github/workflows/csmc-consumer-constrained-lab-smoke.yml'
  workflow_dispatch:

jobs:
  consumer-constrained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON artifacts
        run: |
          python -m json.tool tools/csmc_importer/importer_lab/CSMC_CONSUMER_CONSTRAINT_PACK_V1.json >/dev/null
          python -m json.tool tools/csmc_importer/importer_lab/CSMC_IMPORTER_LAB_DISCRIMINATING_QUESTIONS_V1.json >/dev/null
          python -m json.tool tools/csmc_importer/importer_lab/CSMC_IMPORTER_LAB_CONSUMER_COMPATIBILITY_SCHEMA_V1.json >/dev/null
          python -m json.tool tools/csmc_importer/importer_lab/CSMC_DQ_SER_WIDTH_GATE_V1.json >/dev/null
      - name: Compile and test consumer constraints
        working-directory: tools/csmc_importer/importer_lab
        run: |
          python -m py_compile csmc_consumer_constrained_lab.py test_csmc_consumer_constrained_lab_synthetic.py csmc_serializer_field_read_gate.py test_csmc_serializer_field_read_gate.py
          python test_csmc_consumer_constrained_lab_synthetic.py
          python test_csmc_serializer_field_read_gate.py
      - name: Re-run M1 acceptance v2
        working-directory: tools/csmc_importer/importer_lab
        run: python test_csmc_importer_lab_m1_acceptance_v2.py
