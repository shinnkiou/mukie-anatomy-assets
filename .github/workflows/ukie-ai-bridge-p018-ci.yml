name: UKIE AI Bridge P0.18.2 Standalone Worker CI

on:
  push:
    branches:
      - ukie-ai-bridge-foundation
    paths:
      - 'ukie-ai-bridge/bridge/worker_credentials.py'
      - 'ukie-ai-bridge/bridge/worker_transport.py'
      - 'ukie-ai-bridge/bridge/cli_p018.py'
      - 'ukie-ai-bridge/bridge/cli_p0181.py'
      - 'ukie-ai-bridge/bridge/cli_p0182.py'
      - 'ukie-ai-bridge/tests/test_worker_p018.py'
      - '.github/workflows/ukie-ai-bridge-p018-ci.yml'
  pull_request:
    paths:
      - 'ukie-ai-bridge/bridge/worker_credentials.py'
      - 'ukie-ai-bridge/bridge/worker_transport.py'
      - 'ukie-ai-bridge/bridge/cli_p018.py'
      - 'ukie-ai-bridge/bridge/cli_p0181.py'
      - 'ukie-ai-bridge/bridge/cli_p0182.py'
      - 'ukie-ai-bridge/tests/test_worker_p018.py'
      - '.github/workflows/ukie-ai-bridge-p018-ci.yml'

jobs:
  windows-worker-transport-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ukie-ai-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q bridge blender fixtures tests

      - name: Run historical and P0.18 regression suite
        run: python -m unittest discover -s tests -v

      - name: Verify P0.18.2 standalone bootstrap source contract
        run: python bridge/cli_p0182.py bootstrap-self-test

      - name: Generate exact embedded release identity
        shell: pwsh
        run: |
          Set-Content -Path bridge\embedded_release_p0182.py -Encoding ascii -Value @(
            'RELEASE_KEY = "BRIDGE_P0182_RUN_${{ github.run_id }}"',
            'BRIDGE_VERSION = "0.18.2-p0.18.2"',
            'COMMIT_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"',
            'WORKFLOW_RUN_ID = ${{ github.run_id }}'
          )
          Get-Content bridge\embedded_release_p0182.py

      - name: Run P0.18.2 inherited self-test
        run: python bridge/cli_p0182.py self-test

      - name: Build standalone P0.18.2 one-file Windows worker
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name UKIE_AI_BRIDGE_WORKER --paths . --hidden-import bridge.state_store --hidden-import bridge.job_controller --hidden-import bridge.retry_contract --hidden-import bridge.known_failures --hidden-import bridge.preflight --hidden-import bridge.artifact_validation --hidden-import bridge.auth_health --hidden-import bridge.experiment_manifest --hidden-import bridge.analyze_runner --hidden-import bridge.blender_canary --hidden-import bridge.canary_verifier --hidden-import bridge.gpu_probe --hidden-import bridge.physical_acceptance --hidden-import bridge.acceptance_verifier --hidden-import bridge.handoff --hidden-import bridge.handoff_auto --hidden-import bridge.drive_discovery --hidden-import bridge.cloud_intake --hidden-import bridge.cloud_recovery --hidden-import bridge.release_gate --hidden-import bridge.blender_selector --hidden-import bridge.blender_bootstrap --hidden-import bridge.worker_credentials --hidden-import bridge.worker_transport --hidden-import bridge.cli --hidden-import bridge.cli_p012 --hidden-import bridge.cli_p014 --hidden-import bridge.cli_p015 --hidden-import bridge.cli_p018 --hidden-import bridge.cli_p0181 --hidden-import bridge.cli_p0182 --hidden-import bridge.embedded_release_p0182 --add-data "blender/analyze_scene.py;blender" --add-data "blender/create_canary.py;blender" --add-data "blender/gpu_probe.py;blender" bridge/cli_p0182.py

      - name: Exercise packaged standalone safety surface
        shell: pwsh
        run: |
          .\dist\UKIE_AI_BRIDGE_WORKER.exe bootstrap-self-test
          if ($LASTEXITCODE -ne 0) { throw 'packaged bootstrap self-test failed' }
          .\dist\UKIE_AI_BRIDGE_WORKER.exe self-test
          if ($LASTEXITCODE -ne 0) { throw 'packaged inherited self-test failed' }
          .\dist\UKIE_AI_BRIDGE_WORKER.exe device-status
          if ($LASTEXITCODE -ne 0) { throw 'packaged device-status failed' }

      - name: Stage P0.18.2 standalone worker release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-p0182 | Out-Null
          Copy-Item dist\UKIE_AI_BRIDGE_WORKER.exe release-p0182\UKIE_AI_BRIDGE_WORKER.exe
          $releaseInfo = [ordered]@{
            schema_version = "ukie_bridge_release_info_v1"
            release_key = "BRIDGE_P0182_RUN_${{ github.run_id }}"
            bridge_version = "0.18.2-p0.18.2"
            commit_sha = "${{ github.event.pull_request.head.sha || github.sha }}"
            workflow_run_id = [int64]${{ github.run_id }}
            bp3d_blender_pin = "4.2.23"
            channel = "CANARY"
            worker_protocol = "ukie_worker_v1"
            worker_allowlist = @("device_status")
            pairing_ui = "https://sync-ops-base.base44.app/"
            launch_mode = "DOUBLE_CLICK_STANDALONE_EXE"
            requires_cmd = $false
            requires_adjacent_release_info = $false
          } | ConvertTo-Json
          Set-Content -Path release-p0182\RELEASE_INFO.json -Encoding utf8NoBOM -Value $releaseInfo
          Set-Content -Path release-p0182\README_FIRST.txt -Encoding ascii -Value @(
            "UKIE AI BRIDGE P0.18.2 standalone paired cloud worker",
            "1. Normal bootstrap: double-click UKIE_AI_BRIDGE_WORKER.exe.",
            "2. No CMD launcher is required.",
            "3. The exact release identity is embedded into the EXE at CI build time.",
            "4. Pairing opens through the Base44 public root.",
            "5. After explicit Google owner approval the worker runs device_status only.",
            "6. The device secret is generated locally and protected with Windows DPAPI.",
            "7. Supabase stores only the SHA256 of the device secret.",
            "8. No source blend is modified by this worker bootstrap path."
          )
          Get-ChildItem release-p0182

      - name: Upload P0.18.2 standalone Windows package
        uses: actions/upload-artifact@v4
        with:
          name: UKIE_AI_BRIDGE-P0.18.2-standalone-windows
          path: ukie-ai-bridge/release-p0182/*
          if-no-files-found: error
          retention-days: 14
