name: UKIE AI Bridge P0.18.1 Worker Transport CI

on:
  push:
    branches:
      - ukie-ai-bridge-foundation
    paths:
      - 'ukie-ai-bridge/bridge/worker_credentials.py'
      - 'ukie-ai-bridge/bridge/worker_transport.py'
      - 'ukie-ai-bridge/bridge/cli_p018.py'
      - 'ukie-ai-bridge/bridge/cli_p0181.py'
      - 'ukie-ai-bridge/tests/test_worker_p018.py'
      - 'ukie-ai-bridge/windows/RUN_WORKER_P018.cmd'
      - '.github/workflows/ukie-ai-bridge-p018-ci.yml'
  pull_request:
    paths:
      - 'ukie-ai-bridge/bridge/worker_credentials.py'
      - 'ukie-ai-bridge/bridge/worker_transport.py'
      - 'ukie-ai-bridge/bridge/cli_p018.py'
      - 'ukie-ai-bridge/bridge/cli_p0181.py'
      - 'ukie-ai-bridge/tests/test_worker_p018.py'
      - 'ukie-ai-bridge/windows/RUN_WORKER_P018.cmd'
      - '.github/workflows/ukie-ai-bridge-p018-ci.yml'

jobs:
  windows-worker-transport-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ukie-ai-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q bridge blender fixtures tests

      - name: Run historical and P0.18 regression suite
        run: python -m unittest discover -s tests -v

      - name: Validate P0.18 launcher bytes
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes('windows\RUN_WORKER_P018.cmd')
          if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { throw 'launcher contains UTF-8 BOM' }
          if (($b | Where-Object { $_ -gt 127 }).Count -ne 0) { throw 'launcher must remain ASCII-only' }
          Write-Host 'PASS launcher ASCII/no-BOM'

      - name: Verify P0.18.1 root pairing route
        run: python -c "from bridge import cli_p0181, worker_transport; assert cli_p0181.BRIDGE_VERSION == '0.18.1-p0.18.1'; assert worker_transport.PAIRING_UI_URL == 'https://sync-ops-base.base44.app/'"

      - name: Run P0.18.1 source self-test
        run: python bridge/cli_p0181.py self-test

      - name: Build P0.18.1 one-file Windows executable
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name UKIE_AI_BRIDGE --paths . --hidden-import bridge.state_store --hidden-import bridge.job_controller --hidden-import bridge.retry_contract --hidden-import bridge.known_failures --hidden-import bridge.preflight --hidden-import bridge.artifact_validation --hidden-import bridge.auth_health --hidden-import bridge.experiment_manifest --hidden-import bridge.analyze_runner --hidden-import bridge.blender_canary --hidden-import bridge.canary_verifier --hidden-import bridge.gpu_probe --hidden-import bridge.physical_acceptance --hidden-import bridge.acceptance_verifier --hidden-import bridge.handoff --hidden-import bridge.handoff_auto --hidden-import bridge.drive_discovery --hidden-import bridge.cloud_intake --hidden-import bridge.cloud_recovery --hidden-import bridge.release_gate --hidden-import bridge.blender_selector --hidden-import bridge.blender_bootstrap --hidden-import bridge.worker_credentials --hidden-import bridge.worker_transport --hidden-import bridge.cli --hidden-import bridge.cli_p012 --hidden-import bridge.cli_p014 --hidden-import bridge.cli_p015 --hidden-import bridge.cli_p018 --hidden-import bridge.cli_p0181 --add-data "blender/analyze_scene.py;blender" --add-data "blender/create_canary.py;blender" --add-data "blender/gpu_probe.py;blender" bridge/cli_p0181.py

      - name: Exercise packaged P0.18.1 safety surface
        shell: pwsh
        run: |
          .\dist\UKIE_AI_BRIDGE.exe self-test
          if ($LASTEXITCODE -ne 0) { throw 'packaged self-test failed' }
          .\dist\UKIE_AI_BRIDGE.exe device-status
          if ($LASTEXITCODE -ne 0) { throw 'packaged device-status failed' }

      - name: Stage P0.18.1 paired worker package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-p0181 | Out-Null
          Copy-Item dist\UKIE_AI_BRIDGE.exe release-p0181\UKIE_AI_BRIDGE.exe
          Copy-Item windows\RUN_WORKER_P018.cmd release-p0181\RUN_WORKER.cmd
          $releaseInfo = [ordered]@{
            schema_version = "ukie_bridge_release_info_v1"
            release_key = "BRIDGE_P0181_RUN_${{ github.run_id }}"
            bridge_version = "0.18.1-p0.18.1"
            commit_sha = "${{ github.event.pull_request.head.sha || github.sha }}"
            workflow_run_id = [int64]${{ github.run_id }}
            bp3d_blender_pin = "4.2.23"
            channel = "CANARY"
            worker_protocol = "ukie_worker_v1"
            worker_allowlist = @("device_status")
            pairing_ui = "https://sync-ops-base.base44.app/"
          } | ConvertTo-Json
          Set-Content -Path release-p0181\RELEASE_INFO.json -Encoding utf8NoBOM -Value $releaseInfo
          Set-Content -Path release-p0181\README_FIRST.txt -Encoding ascii -Value @(
            "UKIE AI BRIDGE P0.18.1 paired cloud worker",
            "1. Double-click RUN_WORKER.cmd only for the one-time/bootstrap worker start.",
            "2. The worker generates its own secret locally and protects it with Windows DPAPI.",
            "3. Supabase stores only the SHA256 of the device secret.",
            "4. Pairing opens through the Base44 public root to avoid SPA deep-link 404.",
            "5. P0.18.1 cloud execution allowlist contains device_status only.",
            "6. The worker uses a short job lease; stale completion is rejected.",
            "7. No source blend is modified by the P0.18.1 worker path."
          )
          Get-ChildItem release-p0181

      - name: Upload P0.18.1 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: UKIE_AI_BRIDGE-P0.18.1-windows
          path: ukie-ai-bridge/release-p0181/*
          if-no-files-found: error
          retention-days: 14
