name: UKIE AI Bridge P0.15 Pinned Blender CI

on:
  push:
    branches:
      - ukie-ai-bridge-foundation
    paths:
      - 'ukie-ai-bridge/bridge/blender_selector.py'
      - 'ukie-ai-bridge/bridge/blender_bootstrap.py'
      - 'ukie-ai-bridge/bridge/cli_p015.py'
      - 'ukie-ai-bridge/tests/test_blender_p015.py'
      - 'ukie-ai-bridge/windows/RUN_FIRST_ACCEPTANCE_P015.cmd'
      - '.github/workflows/ukie-ai-bridge-p015-ci.yml'
  pull_request:
    paths:
      - 'ukie-ai-bridge/bridge/blender_selector.py'
      - 'ukie-ai-bridge/bridge/blender_bootstrap.py'
      - 'ukie-ai-bridge/bridge/cli_p015.py'
      - 'ukie-ai-bridge/tests/test_blender_p015.py'
      - 'ukie-ai-bridge/windows/RUN_FIRST_ACCEPTANCE_P015.cmd'
      - '.github/workflows/ukie-ai-bridge-p015-ci.yml'

jobs:
  windows-pinned-blender-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ukie-ai-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q bridge blender fixtures tests

      - name: Run full historical and P0.15 regression suite
        run: python -m unittest discover -s tests -v

      - name: Validate P0.15 launcher bytes
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes('windows\RUN_FIRST_ACCEPTANCE_P015.cmd')
          if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { throw 'launcher contains UTF-8 BOM' }
          if (($b | Where-Object { $_ -gt 127 }).Count -ne 0) { throw 'launcher must remain ASCII-only' }
          Write-Host 'PASS launcher ASCII/no-BOM'

      - name: Run P0.15 source self-test
        run: python bridge/cli_p015.py self-test

      - name: Prove missing pin does not silently accept runner Blender
        shell: pwsh
        run: |
          python bridge/cli_p015.py blender-discovery
          if ($LASTEXITCODE -eq 0) { Write-Host 'Runner happened to contain exact Blender pin; acceptable.' } else { Write-Host 'EXPECTED: no exact pin on generic runner.'; $global:LASTEXITCODE = 0 }

      - name: Build P0.15 one-file Windows executable
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name UKIE_AI_BRIDGE --paths . --hidden-import bridge.state_store --hidden-import bridge.job_controller --hidden-import bridge.retry_contract --hidden-import bridge.known_failures --hidden-import bridge.preflight --hidden-import bridge.artifact_validation --hidden-import bridge.auth_health --hidden-import bridge.experiment_manifest --hidden-import bridge.analyze_runner --hidden-import bridge.blender_canary --hidden-import bridge.canary_verifier --hidden-import bridge.gpu_probe --hidden-import bridge.physical_acceptance --hidden-import bridge.acceptance_verifier --hidden-import bridge.handoff --hidden-import bridge.handoff_auto --hidden-import bridge.drive_discovery --hidden-import bridge.cloud_intake --hidden-import bridge.cloud_recovery --hidden-import bridge.release_gate --hidden-import bridge.blender_selector --hidden-import bridge.blender_bootstrap --hidden-import bridge.cli --hidden-import bridge.cli_p012 --hidden-import bridge.cli_p014 --add-data "blender/analyze_scene.py;blender" --add-data "blender/create_canary.py;blender" --add-data "blender/gpu_probe.py;blender" bridge/cli_p015.py

      - name: Exercise packaged P0.15 safety surface
        shell: pwsh
        run: |
          .\dist\UKIE_AI_BRIDGE.exe self-test
          .\dist\UKIE_AI_BRIDGE.exe device-status
          .\dist\UKIE_AI_BRIDGE.exe blender-discovery
          if ($LASTEXITCODE -ne 0) { Write-Host 'EXPECTED: exact production pin absent on hosted runner.'; $global:LASTEXITCODE = 0 }

      - name: Stage P0.15 one-click Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-p015 | Out-Null
          Copy-Item dist\UKIE_AI_BRIDGE.exe release-p015\UKIE_AI_BRIDGE.exe
          Copy-Item windows\RUN_FIRST_ACCEPTANCE_P015.cmd release-p015\RUN_FIRST_ACCEPTANCE.cmd
          $releaseInfo = [ordered]@{
            schema_version = "ukie_bridge_release_info_v1"
            release_key = "BRIDGE_P015_RUN_${{ github.run_id }}"
            bridge_version = "0.15.0-p0.15"
            commit_sha = "${{ github.event.pull_request.head.sha || github.sha }}"
            workflow_run_id = [int64]${{ github.run_id }}
            bp3d_blender_pin = "4.2.23"
            channel = "FOUNDATION"
          } | ConvertTo-Json
          Set-Content -Path release-p015\RELEASE_INFO.json -Encoding utf8NoBOM -Value $releaseInfo
          Set-Content -Path release-p015\README_FIRST.txt -Encoding ascii -Value @(
            "UKIE AI BRIDGE P0.15 pinned Blender bootstrap",
            "1. Double-click RUN_FIRST_ACCEPTANCE.cmd.",
            "2. Exact Blender 4.2.23 is selected if already installed.",
            "3. If missing, the official portable ZIP and SHA256 are downloaded from download.blender.org.",
            "4. Existing Blender versions are not uninstalled or modified.",
            "5. The verified portable copy is stored under LocalAppData UKIE_AI_BRIDGE tools.",
            "6. P0.14 automatic Drive handoff and local-outbox fallback are inherited.",
            "7. Local success still cannot set READY FOR AI."
          )
          Get-ChildItem release-p015

      - name: Upload P0.15 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: UKIE_AI_BRIDGE-P0.15-windows
          path: ukie-ai-bridge/release-p015/*
          if-no-files-found: error
          retention-days: 14
