name: CSMC importer smoke

on:
  push:
    branches:
      - csmc-importer-experimental-20260902
    paths:
      - 'tools/csmc_importer/**'
      - '.github/workflows/csmc-importer-smoke.yml'
  workflow_dispatch:

jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile public-safe probes
        run: |
          python -m py_compile \
            tools/csmc_importer/csmc_core.py \
            tools/csmc_importer/clip_3d_diff.py \
            tools/csmc_importer/csmc_3d_integration_probe.py \
            tools/csmc_importer/csmc_3d_evidence_probe.py \
            tools/csmc_importer/runtime_blob_compare.py \
            tools/csmc_importer/csmc_p4_anchor_probe.py \
            tools/csmc_importer/csmc_p4_tail_rewrite_profile.py \
            tools/csmc_importer/csmc_p4_stride_cadence_probe.py \
            tools/csmc_importer/csmc_p4_control_zone_grammar_probe.py \
            tools/csmc_importer/csmc_p4_owner_consume_bracket_probe.py \
            tools/csmc_importer/csmc_p4_barrier_collision_baseline_probe.py \
            tools/csmc_importer/csmc_p4_unaligned_kmer_extinction_probe.py \
            tools/csmc_importer/csmc_p4_counted_be_binding_probe.py \
            tools/csmc_importer/csmc_p4_counted_be_entropy_ceiling.py \
            tools/csmc_importer/csmc_structural_ir.py \
            tools/csmc_importer/modeler_capture_header_probe.py \
            tools/csmc_importer/test_probe_synthetic.py \
            tools/csmc_importer/test_clip_3d_diff_synthetic.py \
            tools/csmc_importer/test_csmc_3d_integration_probe_synthetic.py \
            tools/csmc_importer/test_csmc_3d_evidence_probe_synthetic.py \
            tools/csmc_importer/test_runtime_blob_compare_synthetic.py \
            tools/csmc_importer/test_csmc_p4_anchor_probe_synthetic.py \
            tools/csmc_importer/test_csmc_p4_tail_rewrite_profile_synthetic.py \
            tools/csmc_importer/test_csmc_p4_stride_cadence_probe_synthetic.py \
            tools/csmc_importer/test_csmc_p4_control_zone_grammar_probe_synthetic.py \
            tools/csmc_importer/test_csmc_p4_owner_consume_bracket_probe_synthetic.py \
            tools/csmc_importer/test_csmc_p4_barrier_collision_baseline_probe_synthetic.py \
            tools/csmc_importer/test_csmc_p4_unaligned_kmer_extinction_probe_synthetic.py \
            tools/csmc_importer/test_csmc_p4_counted_be_binding_probe_synthetic.py \
            tools/csmc_importer/test_csmc_p4_counted_be_entropy_ceiling_synthetic.py \
            tools/csmc_importer/test_csmc_structural_ir_synthetic.py \
            tools/csmc_importer/test_modeler_capture_header_probe_synthetic.py \
            tools/csmc_importer/test_modeler_observer_p4_contract.py
      - name: CSMC/CS3C schema smoke
        working-directory: tools/csmc_importer
        run: python test_probe_synthetic.py
      - name: Synthetic CLIP scene differential smoke
        working-directory: tools/csmc_importer
        run: python test_clip_3d_diff_synthetic.py
      - name: Synthetic CLIP/CSMC integration graph smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_3d_integration_probe_synthetic.py
      - name: Synthetic CLIP/CSMC evidence-liveness smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_3d_evidence_probe_synthetic.py
      - name: Synthetic runtime blob identity/mutation/insertion smoke
        working-directory: tools/csmc_importer
        run: python test_runtime_blob_compare_synthetic.py
      - name: Synthetic P4 CELSYS structural anchor smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_anchor_probe_synthetic.py
      - name: Synthetic P4 tail rewrite statistical profile smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_tail_rewrite_profile_synthetic.py
      - name: Synthetic P4 stride cadence metadata smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_stride_cadence_probe_synthetic.py
      - name: Synthetic P4 control-zone grammar smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_control_zone_grammar_probe_synthetic.py
      - name: Synthetic P4 owner/consume bracket smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_owner_consume_bracket_probe_synthetic.py
      - name: Synthetic P4 barrier collision baseline smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_barrier_collision_baseline_probe_synthetic.py
      - name: Synthetic P4 unaligned k-mer extinction smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_unaligned_kmer_extinction_probe_synthetic.py
      - name: Synthetic P4 counted-BE fixed-role binding smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_counted_be_binding_probe_synthetic.py
      - name: Synthetic P4 counted-BE entropy ceiling smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_p4_counted_be_entropy_ceiling_synthetic.py
      - name: Synthetic semantics-free structural IR smoke
        working-directory: tools/csmc_importer
        run: python test_csmc_structural_ir_synthetic.py
      - name: Synthetic historical runtime header validation smoke
        working-directory: tools/csmc_importer
        run: python test_modeler_capture_header_probe_synthetic.py
      - name: Fail-closed P4 Modeler observer contract smoke
        working-directory: tools/csmc_importer
        run: python test_modeler_observer_p4_contract.py
