name: CSMC controlled fixture smoke

on:
  push:
    branches:
      - csmc-importer-experimental-20260902
    paths:
      - 'tools/csmc_importer/csmc_controlled_envelope.py'
      - 'tools/csmc_importer/test_csmc_controlled_envelope_synthetic.py'
      - 'tools/csmc_importer/csmc_controlled_evidence_ir.py'
      - 'tools/csmc_importer/test_csmc_controlled_evidence_ir_synthetic.py'
      - 'tools/csmc_importer/csmc_import_intake.py'
      - 'tools/csmc_importer/test_csmc_import_intake_synthetic.py'
      - 'tools/csmc_importer/csmc_controlled_phase_class_probe.py'
      - 'tools/csmc_importer/test_csmc_controlled_phase_class_probe_synthetic.py'
      - 'tools/csmc_importer/csmc_pair_invariant_evidence.py'
      - 'tools/csmc_importer/test_csmc_pair_invariant_evidence_synthetic.py'
      - 'tools/csmc_importer/csmc_pair_search_mask.py'
      - 'tools/csmc_importer/test_csmc_pair_search_mask_synthetic.py'
      - 'tools/csmc_importer/csmc_controlled_name_literal_probe.py'
      - 'tools/csmc_importer/test_csmc_controlled_name_literal_probe_synthetic.py'
      - 'tools/csmc_importer/csmc_controlled_prefix_extinction_probe.py'
      - 'tools/csmc_importer/test_csmc_controlled_prefix_extinction_probe_synthetic.py'
      - 'tools/csmc_importer/csmc_controlled_size_law_probe.py'
      - 'tools/csmc_importer/test_csmc_controlled_size_law_probe_synthetic.py'
      - 'tools/csmc_importer/CSMC_CONTROLLED_FIXTURE_MAINLINE_FINDINGS_20260914.md'
      - 'tools/csmc_importer/CSMC_CONTROLLED_FIXTURE_PUBLIC_INDEX_20260914.json'
      - 'tools/csmc_importer/CSMC_IMPORT_INTAKE_V01_20260914.md'
      - 'tools/csmc_importer/CSMC_CONTROLLED_PHASE_CLASS_FINDINGS_20260914.md'
      - 'tools/csmc_importer/CSMC_CONTROLLED_PHASE_CLASS_AGGREGATE_20260914.json'
      - 'tools/csmc_importer/CSMC_CONTROLLED_NAME_LITERAL_FINDINGS_20260914.md'
      - 'tools/csmc_importer/CSMC_CONTROLLED_NAME_LITERAL_AGGREGATE_20260914.json'
      - 'tools/csmc_importer/CSMC_CONTROLLED_PREFIX_EXTINCTION_FINDINGS_20260914.md'
      - 'tools/csmc_importer/CSMC_CONTROLLED_PREFIX_EXTINCTION_AGGREGATE_20260914.json'
      - 'tools/csmc_importer/CSMC_CONTROLLED_SIZE_LAW_FINDINGS_20260914.md'
      - 'tools/csmc_importer/CSMC_CONTROLLED_SIZE_LAW_AGGREGATE_20260914.json'
      - '.github/workflows/csmc-controlled-fixture-smoke.yml'
  workflow_dispatch:

jobs:
  synthetic-controlled-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile controlled fixture parser and evidence sidecars
        run: |
          python -m py_compile \
            tools/csmc_importer/csmc_controlled_envelope.py \
            tools/csmc_importer/test_csmc_controlled_envelope_synthetic.py \
            tools/csmc_importer/csmc_controlled_evidence_ir.py \
            tools/csmc_importer/test_csmc_controlled_evidence_ir_synthetic.py \
            tools/csmc_importer/csmc_import_intake.py \
            tools/csmc_importer/test_csmc_import_intake_synthetic.py \
            tools/csmc_importer/csmc_controlled_phase_class_probe.py \
            tools/csmc_importer/test_csmc_controlled_phase_class_probe_synthetic.py \
            tools/csmc_importer/csmc_pair_invariant_evidence.py \
            tools/csmc_importer/test_csmc_pair_invariant_evidence_synthetic.py \
            tools/csmc_importer/csmc_pair_search_mask.py \
            tools/csmc_importer/test_csmc_pair_search_mask_synthetic.py \
            tools/csmc_importer/csmc_controlled_name_literal_probe.py \
            tools/csmc_importer/test_csmc_controlled_name_literal_probe_synthetic.py \
            tools/csmc_importer/csmc_controlled_prefix_extinction_probe.py \
            tools/csmc_importer/test_csmc_controlled_prefix_extinction_probe_synthetic.py \
            tools/csmc_importer/csmc_controlled_size_law_probe.py \
            tools/csmc_importer/test_csmc_controlled_size_law_probe_synthetic.py
      - name: Run controlled envelope synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_controlled_envelope_synthetic.py
      - name: Run controlled evidence sidecar synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_controlled_evidence_ir_synthetic.py
      - name: Run fail-closed importer intake integration tests
        working-directory: tools/csmc_importer
        run: python test_csmc_import_intake_synthetic.py
      - name: Run controlled phase-class synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_controlled_phase_class_probe_synthetic.py
      - name: Run pair invariant evidence synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_pair_invariant_evidence_synthetic.py
      - name: Run pair search-mask synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_pair_search_mask_synthetic.py
      - name: Run controlled name-literal synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_controlled_name_literal_probe_synthetic.py
      - name: Run controlled prefix-extinction synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_controlled_prefix_extinction_probe_synthetic.py
      - name: Run bounded size-law synthetic tests
        working-directory: tools/csmc_importer
        run: python test_csmc_controlled_size_law_probe_synthetic.py
