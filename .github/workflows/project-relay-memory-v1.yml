name: PROJECT RELAY Selective Memory v1

on:
  push:
    branches:
      - project-relay-v1-virtual
    paths:
      - 'project_relay_v1/memory_rules_v1.json'
      - 'project_relay_v1/memory_context_loader.py'
      - 'project_relay_v1/memory_context_loader.mjs'
      - 'project_relay_v1/context_guard.py'
      - 'project_relay_v1/test_memory_context_loader.py'
      - 'project_relay_v1/test_context_guard.py'
      - 'project_relay_v1/test_memory_parity.py'
      - 'project_relay_v1/testdata/memory_catalog_fixture.json'
      - '.github/workflows/project-relay-memory-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selective-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          python3 --version
          node --version

      - name: Compile Python
        run: python3 -m py_compile project_relay_v1/memory_context_loader.py project_relay_v1/context_guard.py project_relay_v1/test_memory_context_loader.py project_relay_v1/test_context_guard.py project_relay_v1/test_memory_parity.py

      - name: Validate shared rule JSON
        run: python3 -m json.tool project_relay_v1/memory_rules_v1.json >/dev/null

      - name: Run selective memory tests
        working-directory: project_relay_v1
        run: python3 test_memory_context_loader.py

      - name: Run context guard tests
        working-directory: project_relay_v1
        run: python3 test_context_guard.py

      - name: Run Python JavaScript parity tests
        working-directory: project_relay_v1
        run: python3 test_memory_parity.py

      - name: Generate mission context manifests
        run: |
          mkdir -p project_relay_v1/.memory_evidence
          python3 project_relay_v1/memory_context_loader.py \
            'サブカルキャラTの歴史についてまとめる' \
            --catalog project_relay_v1/testdata/memory_catalog_fixture.json \
            --mission-key subculture_character_t_history_20260830 \
            --out project_relay_v1/.memory_evidence/context_manifest_subculture_t.json
          python3 project_relay_v1/memory_context_loader.py \
            'ガンダムにおいて、ザクが完成するまでにどのような紆余曲折を経たのかをまとめる資料を作成。ただしジ・オリジンの設定は参照しない' \
            --catalog project_relay_v1/testdata/memory_catalog_fixture.json \
            --mission-key gundam_zaku_development_pre_origin_20260830 \
            --out project_relay_v1/.memory_evidence/context_manifest_gundam_zaku.json
          test -s project_relay_v1/.memory_evidence/context_manifest_subculture_t.json
          test -s project_relay_v1/.memory_evidence/context_manifest_gundam_zaku.json

      - name: Validate manifest invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('project_relay_v1')
          rules=json.loads((root/'memory_rules_v1.json').read_text(encoding='utf-8'))
          sub=json.loads((root/'.memory_evidence/context_manifest_subculture_t.json').read_text(encoding='utf-8'))
          gun=json.loads((root/'.memory_evidence/context_manifest_gundam_zaku.json').read_text(encoding='utf-8'))

          assert sub['rules_version']==rules['version'], (sub, rules)
          assert sub['task_kind']=='HISTORICAL_RESEARCH', sub
          assert sub['selected_doc_count']==3, sub
          assert sub['constraint_mode']=='NONE', sub
          assert sub['excluded_sources']==[], sub
          assert 'task-explicit-source-exclusion-rules-v1' not in sub['selected_memory_keys'], sub
          assert 'task-blender-runner-rules-v1' not in sub['selected_memory_keys'], sub
          assert sub['estimated_chars'] <= sub['char_budget'], sub

          assert gun['rules_version']==rules['version'], (gun, rules)
          assert gun['task_kind']=='HISTORICAL_RESEARCH', gun
          assert gun['constraint_mode']=='EXPLICIT_SOURCE_EXCLUSION', gun
          assert gun['excluded_sources']==['ジ・オリジン'], gun
          assert gun['selected_doc_count']==4, gun
          assert 'task-explicit-source-exclusion-rules-v1' in gun['selected_memory_keys'], gun
          assert 'mission-gundam-zaku-development-pre-origin-brief-v1' in gun['selected_memory_keys'], gun
          assert 'mission-subculture-character-t-history-brief-v1' not in gun['selected_memory_keys'], gun
          assert 'task-blender-runner-rules-v1' not in gun['selected_memory_keys'], gun
          assert 'task-discord-transport-v1' not in gun['selected_memory_keys'], gun
          assert gun['estimated_chars'] <= gun['char_budget'], gun
          print('ALL CONTEXT MANIFEST INVARIANTS VALID')
          PY

      - name: Upload context evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-relay-selective-memory-v1-evidence
          path: project_relay_v1/.memory_evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
