name: NEVER TEAR Counter Detail

on:
  push:
    branches: [never-tear-counter-detail-20260830]
    paths:
      - 'cloud_runner/never_tear_counter_build.py'
      - '.github/workflows/never-tear-counter-detail.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: '4.2.23'
  BLENDER_ARCHIVE: 'blender-4.2.23-linux-x64.tar.xz'
  BLENDER_DIR: 'blender-4.2.23-linux-x64'
  NEVER_TEAR_OUT: '${{ github.workspace }}/artifacts/never_tear_counter'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install headless graphics and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libx11-6 libxext6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libsm6 libice6 fonts-noto-cjk jq > /dev/null
      - name: Download and verify Blender 4.2.23
        run: |
          set -euo pipefail
          BASE="https://download.blender.org/release/Blender4.2"
          curl --fail --location --retry 3 --retry-delay 3 -o "${BLENDER_ARCHIVE}" "${BASE}/${BLENDER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 3 -o "blender-${BLENDER_VERSION}.sha256" "${BASE}/blender-${BLENDER_VERSION}.sha256"
          sha256sum --check "blender-${BLENDER_VERSION}.sha256" --ignore-missing
          tar -xf "${BLENDER_ARCHIVE}"
          "${BLENDER_DIR}/blender" --version
      - name: Build individual assets, assemble, render and QA
        run: |
          set -o pipefail
          mkdir -p artifacts/never_tear_counter/reports
          "${BLENDER_DIR}/blender" --factory-startup --background --python cloud_runner/never_tear_counter_build.py 2>&1 | tee artifacts/never_tear_counter/reports/blender.log
      - name: Validate detail artifact
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('artifacts/never_tear_counter')
          p=root/'reports/manifest.json'
          if not p.exists():
              print('manifest missing',file=sys.stderr);sys.exit(2)
          d=json.loads(p.read_text())
          assert d['schema']=='never_tear_counter_detail_v1'
          assert (root/d['final_glb']).exists()
          assert (root/d['final_blend']).exists()
          assert (root/'renders/FINAL_COUNTER_R1.png').exists()
          assert len(d['asset_exports'])>=10
          print(json.dumps({'status':d['status'],'stats':d['stats'],'last_qa':d['qa'][-1]},indent=2))
          PY
      - name: Inventory and SHA256
        if: always()
        run: |
          mkdir -p artifacts/never_tear_counter/reports
          find artifacts/never_tear_counter -type f -printf '%P\t%s bytes\n' | sort > artifacts/never_tear_counter/reports/FILE_INVENTORY.txt
          find artifacts/never_tear_counter -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/never_tear_counter/reports/SHA256SUMS.txt
      - name: Upload NEVER TEAR detail artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: never-tear-counter-detail-${{ github.run_id }}
          path: artifacts/never_tear_counter/
          retention-days: 14
          compression-level: 4
