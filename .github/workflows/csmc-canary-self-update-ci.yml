name: CSMC Canary Self Update Bootstrap CI

on:
  push:
    branches:
      - csmc-canary-self-update-20260913
    paths:
      - 'ukie-ai-bridge/**'
      - '.github/workflows/csmc-canary-self-update-ci.yml'
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ukie-ai-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply established V4.2 observer patch for V4.3 payload
        run: python build_patches/csmc_v42_partial_copy_patch.py

      - name: Compile fixed canary and updater modules
        run: python -m compileall -q bridge CSMC_AutoCycle_V01.py tests/test_csmc_self_update_synthetic.py

      - name: Run synthetic updater success and rollback tests
        run: python tests/test_csmc_self_update_synthetic.py

      - name: Verify self-update fixed-scope safety contract
        shell: pwsh
        run: |
          $src=Get-Content -Raw .\bridge\csmc_self_update.py
          foreach($needle in @(
            'FIXED_RELEASE_ENDPOINT = "https://base44.app/api/apps/6aa2743da37b11162682c01f/functions/csmc-canary-release"',
            'ROOT_SUBDIR = Path("UKIE_AI_BRIDGE") / "csmc-canary"',
            'SCHEMA = "csmc_canary_self_update_manifest_v1"',
            'PROTOCOL = "csmc_canary_self_update_v1"',
            'drive_raw_readback_verified',
            'package_manifest_all_files_match',
            '"promote": value.get("promote") is True',
            '_verify_package_manifest',
            '_swap_and_verify',
            'heartbeat-only',
            'os.replace',
            'previous'
          )){if(-not$src.Contains($needle)){throw "self-update marker missing: $needle"}}
          foreach($needle in @('shell=True','os.system','Popen(','WriteProcessMemory','VirtualProtectEx','CreateRemoteThread','reg.exe','winreg','runas','Start-Process -Verb RunAs')){if($src.Contains($needle)){throw "forbidden self-update surface: $needle"}}
          $installer=Get-Content -Raw .\INSTALL_CSMC_CANARY_SELF_UPDATE_BOOTSTRAP.ps1
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($installer,[ref]$tokens,[ref]$errors)
          if($errors.Count-ne0){$errors|ForEach-Object{Write-Error $_.Message};throw 'bootstrap installer parse failed'}
          foreach($needle in @('UKIE_CSMC_CANARY','CSMC_CANARY_SELF_UPDATE.exe','/RL LIMITED','/SC MINUTE /MO 5','UKIE_AI_BRIDGE\csmc-canary','BOOTSTRAP_MANIFEST.json')){if(-not$installer.Contains($needle)){throw "bootstrap installer marker missing: $needle"}}
          foreach($needle in @('/RL HIGHEST','reg.exe','New-Service','sc.exe','RunAs','Invoke-WebRequest','Invoke-RestMethod')){if($installer.Contains($needle)){throw "forbidden bootstrap installer capability: $needle"}}

      - name: Verify canary payload remains isolated and heartbeat-only is local fixed CLI
        shell: pwsh
        run: |
          $cli=Get-Content -Raw .\bridge\cli_p0182_csmc.py
          foreach($needle in @('heartbeat-only','cmd_heartbeat_only','worker_transport.heartbeat()','production_worker_unchanged')){if(-not$cli.Contains($needle)){throw "heartbeat-only marker missing: $needle"}}
          $worker=Get-Content -Raw .\bridge\worker_transport_csmc.py
          foreach($needle in @('CSMC_CANARY_EDGE_URL','CAPTURE_ACTION','DIAG_ACTION','UPLOAD_ACTION')){if(-not$worker.Contains($needle)){throw "canary isolation marker missing: $needle"}}
          if($worker.Contains('ukie-worker-transport"') -and -not $worker.Contains('PRODUCTION_EDGE_URL')){throw 'production transport ambiguity'}

      - name: Generate V4.3 release identity
        shell: pwsh
        run: |
          Set-Content -Path bridge\embedded_release_csmc.py -Encoding ascii -Value @(
            'RELEASE_KEY = "CSMC_CANARY_V43_RUN_${{ github.run_id }}"',
            'BRIDGE_VERSION = "0.18.2-p0.18.2-csmc-canary4.3"',
            'COMMIT_SHA = "${{ github.sha }}"',
            'WORKFLOW_RUN_ID = ${{ github.run_id }}'
          )
          python bridge/cli_p0182_csmc.py self-test

      - name: Build one-file isolated canary V4.3
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name UKIE_AI_BRIDGE_CSMC_CANARY --paths . --hidden-import bridge.main --hidden-import bridge.worker_credentials --hidden-import bridge.worker_transport --hidden-import bridge.worker_transport_csmc --hidden-import bridge.csmc_observer_action --hidden-import bridge.csmc_observer_diagnose_action --hidden-import bridge.csmc_artifact_upload_action --hidden-import bridge.csmc_approved_python --hidden-import bridge.embedded_release_csmc bridge/cli_p0182_csmc.py

      - name: Packaged V4.3 self-test
        shell: pwsh
        run: |
          .\dist\UKIE_AI_BRIDGE_CSMC_CANARY.exe self-test
          if($LASTEXITCODE-ne0){throw 'packaged canary V4.3 self-test failed'}

      - name: Stage self-update V4.3 payload
        shell: pwsh
        run: |
          $out='.\release-csmc-canary-v43';New-Item -ItemType Directory -Force $out|Out-Null
          Copy-Item .\dist\UKIE_AI_BRIDGE_CSMC_CANARY.exe $out
          foreach($name in @('BP3D_ModelerObserver_P4_1.ps1','BP3D_ModelerObserver_P4_1_DIAG_V1.ps1','CSMC_AutoCycle_V01.py')){Copy-Item (Join-Path . $name) (Join-Path $out $name)}
          $release=[ordered]@{
            schema_version='ukie_csmc_canary_release_v4_3';release_key='CSMC_CANARY_V43_RUN_${{ github.run_id }}';bridge_version='0.18.2-p0.18.2-csmc-canary4.3';commit_sha='${{ github.sha }}';workflow_run_id=[int64]${{ github.run_id }};channel='CSMC_CANARY';worker_allowlist=@('device_status','csmc_observer_capture','csmc_observer_diagnose_v1','csmc_artifact_upload');observer_change='error_partial_copy_returned_bytes_salvage_only';self_update_protocol='csmc_canary_self_update_v1';heartbeat_only_cli=$true;production_worker_unchanged=$true;arbitrary_shell=$false;arbitrary_url=$false;arbitrary_path=$false
          }|ConvertTo-Json -Depth 5
          Set-Content (Join-Path $out 'RELEASE_INFO.json') -Encoding utf8NoBOM -Value $release
          $required=@('UKIE_AI_BRIDGE_CSMC_CANARY.exe','BP3D_ModelerObserver_P4_1.ps1','BP3D_ModelerObserver_P4_1_DIAG_V1.ps1','CSMC_AutoCycle_V01.py','RELEASE_INFO.json')
          $files=@();foreach($name in $required){$p=Join-Path $out $name;$files+=[ordered]@{name=$name;size=(Get-Item $p).Length;sha256=(Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant()}}
          [ordered]@{schema_version='ukie_csmc_canary_package_manifest_v2';required_files=$required;files=$files}|ConvertTo-Json -Depth 5|Set-Content (Join-Path $out 'PACKAGE_MANIFEST.json') -Encoding utf8NoBOM
          Set-Content (Join-Path $out 'README_FIRST.txt') -Encoding utf8NoBOM -Value @('CSMC isolated canary V4.3 self-update payload.','Not manually installed. Intended only for fixed CSMC_CANARY_SELF_UPDATE bootstrap promotion.','V4.2 partial-copy Observer behavior is preserved. Added heartbeat-only CLI for post-swap verification.','No Production Worker mutation, arbitrary command/path/URL, admin elevation, registry change, or MODELER UI action.')
          $manifest=Get-Content -Raw (Join-Path $out 'PACKAGE_MANIFEST.json')|ConvertFrom-Json
          foreach($e in $manifest.files){$p=Join-Path $out $e.name;if((Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant()-ne([string]$e.sha256).ToLowerInvariant()){throw "V4.3 package hash mismatch: $($e.name)"}}

      - name: Build immutable self-update bootstrap executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name CSMC_CANARY_SELF_UPDATE --paths . --hidden-import bridge.worker_credentials --hidden-import bridge.csmc_self_update bridge/cli_csmc_self_update.py

      - name: Packaged bootstrap self-test
        shell: pwsh
        run: |
          .\dist\CSMC_CANARY_SELF_UPDATE.exe self-test
          if($LASTEXITCODE-ne0){throw 'packaged bootstrap self-test failed'}

      - name: Stage bootstrap v1 package
        shell: pwsh
        run: |
          $out='.\release-csmc-self-update-bootstrap-v1';New-Item -ItemType Directory -Force $out|Out-Null
          Copy-Item .\dist\CSMC_CANARY_SELF_UPDATE.exe $out
          Copy-Item .\INSTALL_CSMC_CANARY_SELF_UPDATE_BOOTSTRAP.ps1 $out
          $exe=Join-Path $out 'CSMC_CANARY_SELF_UPDATE.exe'
          $files=@([ordered]@{name='CSMC_CANARY_SELF_UPDATE.exe';size=(Get-Item $exe).Length;sha256=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()})
          [ordered]@{schema_version='csmc_canary_self_update_bootstrap_manifest_v1';bootstrap_version=1;fixed_task='UKIE_CSMC_CANARY';fixed_root='%LOCALAPPDATA%\UKIE_AI_BRIDGE\csmc-canary';fixed_release_endpoint='https://base44.app/api/apps/6aa2743da37b11162682c01f/functions/csmc-canary-release';files=$files;production_worker_unchanged=$true;admin_required=$false;registry_changed=$false}|ConvertTo-Json -Depth 5|Set-Content (Join-Path $out 'BOOTSTRAP_MANIFEST.json') -Encoding utf8NoBOM
          Set-Content (Join-Path $out 'README_FIRST.txt') -Encoding utf8NoBOM -Value @('CSMC_CANARY_SELF_UPDATE bootstrap v1.','This is the final one-time manual bootstrap installation. After this, promoted CSMC canary versions update through the fixed release endpoint without ZIP download/extraction/PowerShell per version.','Run INSTALL_CSMC_CANARY_SELF_UPDATE_BOOTSTRAP.ps1 once.','The fixed task UKIE_CSMC_CANARY is repointed to the immutable bootstrap at LIMITED privilege.','Only releases with CI success + package SHA + Drive raw readback size/SHA match + package-manifest match + promote=true are accepted.','Update pipeline: download -> staging -> SHA/manifest verify -> self-test -> current swap -> heartbeat-only -> success; rollback to previous on failure.','Production Worker, registry, services, arbitrary URL/path/command and admin elevation are untouched.')

      - name: Upload V4.3 self-update payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UKIE_AI_BRIDGE-CSMC-canary-v43-self-update-payload
          path: ukie-ai-bridge/release-csmc-canary-v43/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload bootstrap v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UKIE_AI_BRIDGE-CSMC-self-update-bootstrap-v1
          path: ukie-ai-bridge/release-csmc-self-update-bootstrap-v1/*
          if-no-files-found: error
          retention-days: 30
