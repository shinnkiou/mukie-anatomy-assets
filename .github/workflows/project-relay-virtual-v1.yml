name: PROJECT RELAY Virtual v1

on:
  push:
    branches:
      - project-relay-v1-virtual
    paths:
      - 'project_relay_v1/**'
      - '.github/workflows/project-relay-virtual-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-self-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      - name: Compile virtual runner and tests
        run: python3 -m py_compile project_relay_v1/virtual_runner.py project_relay_v1/test_virtual_runner.py project_relay_v1/test_authless_core.py

      - name: Run autonomous failure-repair-retry test
        run: python3 project_relay_v1/test_virtual_runner.py

      - name: Run Discord-OAuth-free cloud core proof
        run: python3 project_relay_v1/test_authless_core.py

      - name: Validate self-repair artifacts
        run: |
          test -s project_relay_v1/.ci_artifacts/virtual-selfrepair-ci/final/result.json
          test -s project_relay_v1/.ci_artifacts/virtual-selfrepair-ci/final/SUCCESS
          test -s project_relay_v1/.ci_artifacts/virtual-selfrepair-ci/final/artifact_manifest.json
          unzip -t project_relay_v1/.ci_artifacts/virtual-selfrepair-ci/attempt_02/RESULTS.zip

      - name: Validate authless core artifacts
        run: |
          test -s project_relay_v1/.authless_artifacts/authless-core-ci/final/result.json
          test -s project_relay_v1/.authless_artifacts/authless-core-ci/final/SUCCESS
          test -s project_relay_v1/.authless_artifacts/authless-core-ci/attempt_01/result/authless_core.txt
          test -s project_relay_v1/.authless_artifacts/authless-core-ci/attempt_01/result/control_plane.json
          unzip -t project_relay_v1/.authless_artifacts/authless-core-ci/attempt_01/RESULTS.zip

      - name: Upload virtual self-repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-relay-virtual-v1-evidence
          path: project_relay_v1/.ci_artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload authless cloud core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-relay-authless-core-evidence
          path: project_relay_v1/.authless_artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
