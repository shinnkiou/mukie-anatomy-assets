name: UKIE AI Bridge P0 CI

on:
  push:
    branches:
      - ukie-ai-bridge-foundation
    paths:
      - 'ukie-ai-bridge/**'
      - '.github/workflows/ukie-ai-bridge-ci.yml'
  pull_request:
    paths:
      - 'ukie-ai-bridge/**'
      - '.github/workflows/ukie-ai-bridge-ci.yml'

jobs:
  windows-foundation-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ukie-ai-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m py_compile bridge/validator.py bridge/install_manifest.py bridge/toolchain.py bridge/state_store.py bridge/job_controller.py bridge/known_failures.py bridge/preflight.py bridge/artifact_validation.py bridge/auth_health.py bridge/experiment_manifest.py bridge/main.py blender/analyze_scene.py

      - name: Run protocol and historical regression tests
        run: python -m unittest discover -s tests -v

      - name: Run source self-test
        run: |
          python bridge/main.py self-test
          python bridge/main.py validate-job fixtures/job_analyze_blend.valid.json
          python bridge/main.py device-status
          python bridge/main.py tool-discovery
          python bridge/main.py validate-install-manifest fixtures/install_approval.valid.json
          python bridge/main.py classify-debugger-line "first chance exception E06D7363"

      - name: Run source preflight fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-preflight | Out-Null
          Set-Content -Path ci-preflight\safe.py -Value "import json`nprint(json.dumps({'ok': True}))" -Encoding utf8NoBOM
          Set-Content -Path ci-preflight\input.blend -Value ("B" * 256) -NoNewline -Encoding ascii
          python bridge/main.py preflight --workspace ci-preflight\workspace --input ci-preflight\input.blend --script ci-preflight\safe.py --python-role BLENDER_INTERNAL --output ci-preflight\preflight.json

      - name: Build one-file Windows executable
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name UKIE_AI_BRIDGE --paths . --hidden-import bridge.state_store --hidden-import bridge.job_controller --hidden-import bridge.known_failures --hidden-import bridge.preflight --hidden-import bridge.artifact_validation --hidden-import bridge.auth_health --hidden-import bridge.experiment_manifest --add-data "blender/analyze_scene.py;blender" bridge/main.py

      - name: Run packaged executable self-test
        run: |
          .\dist\UKIE_AI_BRIDGE.exe self-test
          .\dist\UKIE_AI_BRIDGE.exe validate-job fixtures\job_analyze_blend.valid.json
          .\dist\UKIE_AI_BRIDGE.exe device-status
          .\dist\UKIE_AI_BRIDGE.exe tool-discovery
          .\dist\UKIE_AI_BRIDGE.exe validate-install-manifest fixtures\install_approval.valid.json
          .\dist\UKIE_AI_BRIDGE.exe classify-debugger-line "first chance exception E06D7363"
          .\dist\UKIE_AI_BRIDGE.exe preflight --workspace ci-preflight\workspace2 --input ci-preflight\input.blend --script ci-preflight\safe.py --python-role BLENDER_INTERNAL

      - name: Upload Windows executable and preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: UKIE_AI_BRIDGE-P0-windows
          path: |
            ukie-ai-bridge/dist/UKIE_AI_BRIDGE.exe
            ukie-ai-bridge/ci-preflight/preflight.json
          if-no-files-found: error
          retention-days: 14
