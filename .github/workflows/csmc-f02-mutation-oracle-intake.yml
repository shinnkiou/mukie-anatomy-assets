name: CSMC F02 Mutation Oracle Intake

on:
  push:
    branches:
      - csmc-f02-mutation-oracle-intake-20260914
    paths:
      - 'tools/csmc_importer/oracle_intake/**'
      - '.github/workflows/csmc-f02-mutation-oracle-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-intake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile fail-closed intake CLI
        run: |
          python -m py_compile \
            tools/csmc_importer/oracle_intake/oracle_intake.py \
            tools/csmc_importer/oracle_intake/oracle_intake_cli.py
      - name: Run fail-closed oracle intake tests
        run: python -m unittest discover -s tools/csmc_importer/oracle_intake -p 'test_*.py' -v
      - name: Verify CLI surface is available
        working-directory: tools/csmc_importer/oracle_intake
        run: python oracle_intake_cli.py --help >/dev/null
