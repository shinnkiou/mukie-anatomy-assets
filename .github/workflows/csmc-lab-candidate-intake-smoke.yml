name: CSMC Lab candidate intake smoke

on:
  push:
    branches:
      - csmc-importer-experimental-20260902
    paths:
      - 'tools/csmc_importer/csmc_lab_candidate_intake.py'
      - 'tools/csmc_importer/test_csmc_lab_candidate_intake_synthetic.py'
      - '.github/workflows/csmc-lab-candidate-intake-smoke.yml'
  workflow_dispatch:

jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile fail-closed Lab candidate intake
        run: |
          python -m py_compile \
            tools/csmc_importer/csmc_lab_candidate_intake.py \
            tools/csmc_importer/test_csmc_lab_candidate_intake_synthetic.py
      - name: Run Lab candidate intake synthetic test
        working-directory: tools/csmc_importer
        run: python test_csmc_lab_candidate_intake_synthetic.py
