name: CSMC ModelData serializer bridge gate smoke
on:
  push:
    branches: [csmc-importer-experimental-20260902]
    paths:
      - 'tools/csmc_importer/importer_lab/CSMC_STATIC_DISCRIMINATING_QUESTION_PACKET_V2.json'
      - 'tools/csmc_importer/importer_lab/CSMC_C069_CROSS_LANE_RECONCILIATION_V1.json'
      - 'tools/csmc_importer/importer_lab/csmc_modeldata_serializer_bridge_gate.py'
      - 'tools/csmc_importer/importer_lab/test_csmc_modeldata_serializer_bridge_gate.py'
      - '.github/workflows/csmc-modeldata-serializer-bridge-gate-smoke.yml'
  workflow_dispatch:
jobs:
  bridge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate public-safe JSON
        run: |
          python -m json.tool tools/csmc_importer/importer_lab/CSMC_STATIC_DISCRIMINATING_QUESTION_PACKET_V2.json >/dev/null
          python -m json.tool tools/csmc_importer/importer_lab/CSMC_C069_CROSS_LANE_RECONCILIATION_V1.json >/dev/null
      - name: Compile and test bridge gate
        working-directory: tools/csmc_importer/importer_lab
        run: |
          python -m py_compile csmc_modeldata_serializer_bridge_gate.py test_csmc_modeldata_serializer_bridge_gate.py
          python test_csmc_modeldata_serializer_bridge_gate.py
      - name: Re-run canonical serializer width gate
        working-directory: tools/csmc_importer/importer_lab
        run: python test_csmc_serializer_field_read_gate.py
      - name: Re-run consumer-constrained regression
        working-directory: tools/csmc_importer/importer_lab
        run: python test_csmc_consumer_constrained_lab_synthetic.py
      - name: Re-run M1 acceptance v2
        working-directory: tools/csmc_importer/importer_lab
        run: python test_csmc_importer_lab_m1_acceptance_v2.py
