name: CSMC Worker Observer Automation CI

on:
  push:
    branches:
      - csmc-worker-observer-automation-20260912
    paths:
      - 'ukie-ai-bridge/BP3D_ModelerObserver_P4_1.ps1'
      - 'ukie-ai-bridge/CSMC_AutoCycle_V01.py'
      - 'ukie-ai-bridge/INSTALL_CSMC_CANARY_TASK.ps1'
      - 'ukie-ai-bridge/bridge/csmc_observer_action.py'
      - 'ukie-ai-bridge/bridge/csmc_approved_python.py'
      - 'ukie-ai-bridge/bridge/worker_transport_csmc.py'
      - 'ukie-ai-bridge/bridge/cli_p0182_csmc.py'
      - 'ukie-ai-bridge/tests/test_csmc_observer_action.py'
      - 'ukie-ai-bridge/tests/test_worker_csmc_observer.py'
      - 'ukie-ai-bridge/tests/test_cli_p0182_csmc_once.py'
      - 'ukie-ai-bridge/supabase/migrations/20260912112600_csmc_observer_canary_queue.sql'
      - 'ukie-ai-bridge/supabase/functions/ukie-worker-transport-csmc-canary/index.ts'
      - '.github/workflows/csmc-worker-observer-ci.yml'
  pull_request:
    paths:
      - 'ukie-ai-bridge/BP3D_ModelerObserver_P4_1.ps1'
      - 'ukie-ai-bridge/CSMC_AutoCycle_V01.py'
      - 'ukie-ai-bridge/INSTALL_CSMC_CANARY_TASK.ps1'
      - 'ukie-ai-bridge/bridge/csmc_observer_action.py'
      - 'ukie-ai-bridge/bridge/csmc_approved_python.py'
      - 'ukie-ai-bridge/bridge/worker_transport_csmc.py'
      - 'ukie-ai-bridge/bridge/cli_p0182_csmc.py'
      - 'ukie-ai-bridge/tests/test_csmc_observer_action.py'
      - 'ukie-ai-bridge/tests/test_worker_csmc_observer.py'
      - 'ukie-ai-bridge/tests/test_cli_p0182_csmc_once.py'
      - 'ukie-ai-bridge/supabase/migrations/20260912112600_csmc_observer_canary_queue.sql'
      - 'ukie-ai-bridge/supabase/functions/ukie-worker-transport-csmc-canary/index.ts'
      - '.github/workflows/csmc-worker-observer-ci.yml'

jobs:
  contract-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ukie-ai-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile narrow Worker extension
        run: python -m compileall -q bridge tests CSMC_AutoCycle_V01.py

      - name: Run CSMC observer and one-shot CLI contract tests
        run: python -m unittest tests.test_csmc_observer_action tests.test_worker_csmc_observer tests.test_cli_p0182_csmc_once -v

      - name: Run existing P0.18 Worker transport regression in clean process
        run: python -m unittest tests.test_worker_p018 -v

      - name: Parse fixed PowerShell files
        shell: pwsh
        run: |
          foreach ($path in @('.\BP3D_ModelerObserver_P4_1.ps1', '.\INSTALL_CSMC_CANARY_TASK.ps1')) {
            $src = Get-Content -Raw $path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $path"
            }
          }

      - name: Verify fixed P4.1 sidecar safety contract
        shell: pwsh
        run: |
          $src = Get-Content -Raw .\BP3D_ModelerObserver_P4_1.ps1
          $required = @(
            'ReadProcessMemory',
            'MEM_PRIVATE',
            'CLIP_STUDIO_3D_DATA2',
            'Compress-Archive',
            'automatic_network_upload=$false',
            'explorer_launch=$false',
            'worker_fixed_sidecar=$true'
          )
          $forbidden = @(
            'WriteProcessMemory',
            'VirtualProtectEx',
            'CreateRemoteThread',
            'Invoke-WebRequest',
            'Invoke-RestMethod',
            'System.Net.WebClient',
            'SendKeys',
            'keybd_event',
            'mouse_event',
            'explorer.exe'
          )
          foreach ($needle in $required) {
            if (-not $src.Contains($needle)) { throw "required safety contract missing: $needle" }
          }
          foreach ($needle in $forbidden) {
            if ($src.Contains($needle)) { throw "forbidden capability present: $needle" }
          }

      - name: Verify fixed-script and Scheduled Task safety contract
        shell: pwsh
        run: |
          $pyPolicy = Get-Content -Raw .\bridge\csmc_approved_python.py
          $auto = Get-Content -Raw .\CSMC_AutoCycle_V01.py
          $installer = Get-Content -Raw .\INSTALL_CSMC_CANARY_TASK.ps1
          foreach ($needle in @('CSMC_AutoCycle_V01.py','SHA-256','runpy','cloud-supplied argument')) {
            if (-not $pyPolicy.Contains($needle)) { throw "fixed Python policy marker missing: $needle" }
          }
          foreach ($needle in @('main_worker_cycle','LOCAL_FIXED_ROOT_ONLY','csmc_observer_action.run_capture')) {
            if (-not $auto.Contains($needle)) { throw "fixed auto-cycle marker missing: $needle" }
          }
          foreach ($needle in @('UKIE_CSMC_CANARY','/SC MINUTE','/MO 5','/RL LIMITED','UKIE_AI_BRIDGE_CSMC_CANARY.exe once','PACKAGE_MANIFEST.json')) {
            if (-not $installer.Contains($needle)) { throw "Scheduled Task marker missing: $needle" }
          }
          $codeLines = $installer -split "`r?`n" | Where-Object { $_.Trim() -and -not $_.TrimStart().StartsWith('#') }
          $codeOnly = $codeLines -join "`n"
          foreach ($needle in @('/RL HIGHEST','/RU SYSTEM','-Command','reg.exe','New-Service','sc.exe create')) {
            if ($codeOnly.Contains($needle)) { throw "forbidden installer capability present in executable code: $needle" }
          }

      - name: Verify isolated canary cloud contract is source-separated
        shell: pwsh
        run: |
          $worker = Get-Content -Raw .\bridge\worker_transport_csmc.py
          $edge = Get-Content -Raw .\supabase\functions\ukie-worker-transport-csmc-canary\index.ts
          $migration = Get-Content -Raw .\supabase\migrations\20260912112600_csmc_observer_canary_queue.sql
          foreach ($needle in @('ukie-worker-transport-csmc-canary','CSMC_CANARY_EDGE_URL','requires an existing approved')) {
            if (-not $worker.Contains($needle)) { throw "worker isolation marker missing: $needle" }
          }
          foreach ($needle in @('ukie_csmc_observer_jobs','csmc_observer_capture','production_worker_state_mutated: false')) {
            if (-not $edge.Contains($needle)) { throw "edge isolation marker missing: $needle" }
          }
          foreach ($needle in @('ukie_csmc_observer_jobs','enable row level security','revoke all','ukie_claim_next_csmc_observer_job')) {
            if (-not $migration.Contains($needle)) { throw "migration safety marker missing: $needle" }
          }
          if ($migration.Contains("alter table public.ukie_bridge_jobs")) { throw 'production job table mutation forbidden' }
          if ($edge.Contains('rpc/ukie_claim_next_device_status_job')) { throw 'production claim RPC use forbidden' }

      - name: Generate exact experimental release identity
        shell: pwsh
        run: |
          $autoSha = (Get-FileHash -Algorithm SHA256 .\CSMC_AutoCycle_V01.py).Hash.ToLowerInvariant()
          Set-Content -Path bridge\embedded_release_csmc.py -Encoding ascii -Value @(
            'RELEASE_KEY = "CSMC_WORKER_CANARY_RUN_${{ github.run_id }}"',
            'BRIDGE_VERSION = "0.18.2-p0.18.2-csmc-canary2"',
            'COMMIT_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"',
            'WORKFLOW_RUN_ID = ${{ github.run_id }}',
            "AUTO_CYCLE_PY_SHA256 = `"$autoSha`""
          )
          Get-Content bridge\embedded_release_csmc.py

      - name: Run experimental Worker self-test
        run: python bridge/cli_p0182_csmc.py self-test

      - name: Build experimental one-file CSMC Worker
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --noconfirm --clean --onefile --name UKIE_AI_BRIDGE_CSMC_CANARY --paths . --hidden-import bridge.main --hidden-import bridge.worker_credentials --hidden-import bridge.worker_transport --hidden-import bridge.worker_transport_csmc --hidden-import bridge.csmc_observer_action --hidden-import bridge.csmc_approved_python --hidden-import bridge.embedded_release_csmc bridge/cli_p0182_csmc.py

      - name: Exercise packaged experimental safety surface
        shell: pwsh
        run: |
          .\dist\UKIE_AI_BRIDGE_CSMC_CANARY.exe self-test
          if ($LASTEXITCODE -ne 0) { throw 'packaged CSMC canary self-test failed' }

      - name: Stage experimental package without production deployment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-csmc-canary | Out-Null
          Copy-Item .\dist\UKIE_AI_BRIDGE_CSMC_CANARY.exe .\release-csmc-canary\UKIE_AI_BRIDGE_CSMC_CANARY.exe
          Copy-Item .\BP3D_ModelerObserver_P4_1.ps1 .\release-csmc-canary\BP3D_ModelerObserver_P4_1.ps1
          Copy-Item .\CSMC_AutoCycle_V01.py .\release-csmc-canary\CSMC_AutoCycle_V01.py
          Copy-Item .\INSTALL_CSMC_CANARY_TASK.ps1 .\release-csmc-canary\INSTALL_CSMC_CANARY_TASK.ps1
          $autoSha = (Get-FileHash -Algorithm SHA256 .\CSMC_AutoCycle_V01.py).Hash.ToLowerInvariant()
          $releaseInfo = [ordered]@{
            schema_version = 'ukie_csmc_worker_canary_release_v3'
            release_key = 'CSMC_WORKER_CANARY_RUN_${{ github.run_id }}'
            bridge_version = '0.18.2-p0.18.2-csmc-canary2'
            commit_sha = '${{ github.event.pull_request.head.sha || github.sha }}'
            workflow_run_id = [int64]${{ github.run_id }}
            channel = 'CSMC_CANARY'
            worker_allowlist = @('device_status','csmc_observer_capture')
            canary_transport = 'https://vbuokbwglauibabinaqs.supabase.co/functions/v1/ukie-worker-transport-csmc-canary'
            canary_queue = 'ukie_csmc_observer_jobs'
            sidecar = 'BP3D_ModelerObserver_P4_1.ps1'
            scheduled_task_command = 'UKIE_AI_BRIDGE_CSMC_CANARY.exe once'
            scheduled_task_cadence_minutes = 5
            scheduled_task_run_level = 'LIMITED'
            auto_cycle_python_sha256 = $autoSha
            fixed_python_policy = 'PINNED_RUNPY_NO_ARGS'
            existing_pairing_required = $true
            canary_pairing_creation_disabled = $true
            production_worker_unchanged = $true
            production_edge_unchanged = $true
            production_job_table_unchanged = $true
            production_claim_rpc_unchanged = $true
            arbitrary_shell_disabled = $true
            cloud_filesystem_paths_disabled = $true
            artifact_transfer = 'LOCAL_FIXED_ROOT_ONLY'
          } | ConvertTo-Json
          Set-Content -Path .\release-csmc-canary\RELEASE_INFO.json -Encoding utf8NoBOM -Value $releaseInfo

          $required = @(
            'UKIE_AI_BRIDGE_CSMC_CANARY.exe',
            'BP3D_ModelerObserver_P4_1.ps1',
            'CSMC_AutoCycle_V01.py',
            'RELEASE_INFO.json'
          )
          $entries = foreach ($name in $required) {
            $path = Join-Path .\release-csmc-canary $name
            [ordered]@{
              name = $name
              sha256 = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
              size = (Get-Item $path).Length
            }
          }
          $manifest = [ordered]@{
            schema_version = 'ukie_csmc_canary_package_manifest_v1'
            required_files = $required
            files = @($entries)
          } | ConvertTo-Json -Depth 5
          Set-Content -Path .\release-csmc-canary\PACKAGE_MANIFEST.json -Encoding utf8NoBOM -Value $manifest

          Set-Content -Path .\release-csmc-canary\README_FIRST.txt -Encoding utf8NoBOM -Value @(
            'EXPERIMENTAL ISOLATED CSMC CANARY ONLY - NOT PRODUCTION',
            'This package requires the existing approved P0.18.2 worker credential.',
            'INSTALL_CSMC_CANARY_TASK.ps1 installs one LIMITED scheduled task at a fixed LOCALAPPDATA path.',
            'The task runs only UKIE_AI_BRIDGE_CSMC_CANARY.exe once every five minutes.',
            'Each once invocation performs one isolated heartbeat/claim/execute cycle and exits.',
            'If no canary job is queued, it exits idle and does not run an Observer capture.',
            'It never creates a new pairing and never connects to the production worker queue.',
            'Its cloud transport is the separate ukie-worker-transport-csmc-canary endpoint.',
            'The canary queue accepts only csmc_observer_capture.',
            'MODELER must already be running with the authorized model loaded for a capture job.',
            'The fixed P4.1 sidecar performs read-only attach/scan/package.',
            'No B/Q keyboard input is required.',
            'No cloud-supplied command, executable path, model path, or output path is accepted.',
            'Private runtime ZIP bytes remain local; only bounded metadata may cross the control plane.',
            'Production Worker, Edge allowlist, production job table/claim RPC, and STABLE state are unchanged.'
          )
          Get-ChildItem .\release-csmc-canary

      - name: Verify staged package manifest and installer contract
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw .\release-csmc-canary\PACKAGE_MANIFEST.json | ConvertFrom-Json
          foreach ($entry in $manifest.files) {
            $path = Join-Path .\release-csmc-canary $entry.name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "staged file missing: $($entry.name)" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne ([string]$entry.sha256).ToLowerInvariant()) { throw "staged hash mismatch: $($entry.name)" }
          }
          $installer = Get-Content -Raw .\release-csmc-canary\INSTALL_CSMC_CANARY_TASK.ps1
          if (-not $installer.Contains("UKIE_AI_BRIDGE_CSMC_CANARY.exe once")) { throw 'installer one-shot command missing' }

      - name: Upload experimental package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UKIE_AI_BRIDGE-CSMC-canary-windows
          path: ukie-ai-bridge/release-csmc-canary/*
          if-no-files-found: error
          retention-days: 14
